<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app paint under the notch/home indicator;
         the CSS pays that back with env(safe-area-inset-*) padding.
         ⚠️ `user-scalable=no` used to ride along here, to stop a stray pinch
         zooming the galaxy. It is the ONLY head-tag difference from sibling repo
         traction, which does not have this file's bottom-gap bug on the same
         phone in the same install mode — and a non-scalable viewport is exactly
         the case where WebKit has reason to lay out against the unobscured
         content rect rather than the full window. Safari has ignored it for
         pinch-zoom since iOS 10 anyway, so it was buying nothing. Do not put it
         back; the app's own gesture handlers already call preventDefault. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="adhdo – a galaxy-brained todo app" />
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="color-scheme" content="dark" />

    <!-- Installed-app chrome: full-bleed on iOS, light status-bar glyphs. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="adhdo" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <title>adhdo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
